# Cartão Mestre — vhost nginx para instalação em intranet.
#
# Diferenças em relação a deploy/nginx/cartao-mestre.conf (VPS pública):
#   - escuta na rede (0.0.0.0:80) em vez de 127.0.0.1:8080, porque aqui não
#     existe Cloudflare Tunnel na frente: o navegador do usuário fala direto
#     com este nginx;
#   - "/" redireciona para o dashboard em vez de devolver 404 — na VPS a raiz
#     pertence ao hub pessoal (outro repositório), que não existe aqui;
#   - repassa o IP real do cliente para o serviço de sessão via
#     X-Forwarded-For, papel que na VPS era do header CF-Connecting-IP
#     injetado pelo Cloudflare.
#
# Se a porta 80 do servidor já estiver ocupada (IIS, Apache, outro sistema),
# troque para uma porta livre — ex. "listen 8080;" — e divulgue a URL com a
# porta: http://servidor:8080/cartaomestre/

server {
    listen 80;
    # Aceita qualquer nome/IP pelo qual o servidor for acessado na rede
    # interna. Se houver um nome DNS interno definido, pode trocar por ele
    # (ex.: server_name cartaomestre.empresa.local;).
    server_name _;
    root /var/www/cartao-mestre;

    # Mantém os redirects relativos ("/login/?next=..."), sem reescrever
    # host/porta na Location — o navegador resolve contra a URL atual, que já
    # está correta seja por IP ou por nome DNS interno.
    absolute_redirect off;

    client_max_body_size 1m;

    location = / {
        return 302 /cartaomestre/;
    }

    location = /cartaomestre {
        return 301 /cartaomestre/;
    }

    location /cartaomestre/ {
        auth_request /internal-verify;
        error_page 401 = @login_redirect;
        alias /var/www/cartao-mestre/app/;
        index index.html;
        try_files $uri $uri/ =404;
        # App em atualização frequente: sempre revalidar em vez de servir
        # versão velha do cache do navegador depois de um deploy.
        add_header Cache-Control "no-store" always;
    }

    # Assets do template (fontes/CSS/JS) — sem dado sensível; ficam públicos
    # para que a tela de login também consiga carregá-los antes da sessão
    # existir.
    location /design-system/ {
        alias /var/www/cartao-mestre/design-system/;
    }

    # CSVs. Em instalação com pasta de rede, este diretório é o ponto de
    # montagem do compartilhamento (ver README-INTRANET.md).
    location /dados/ {
        auth_request /internal-verify;
        error_page 401 = @login_redirect;
        alias /var/www/cartao-mestre/dados/;
        add_header Cache-Control "no-store" always;
    }

    # Sub-requisição interna do nginx (não é o navegador batendo aqui) que
    # consulta o serviço de sessão em 127.0.0.1:8082. Sem corpo, só cookie.
    location = /internal-verify {
        internal;
        proxy_pass http://127.0.0.1:8082/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @login_redirect {
        return 302 /login/?next=$request_uri;
    }

    location /login/ {
        alias /var/www/login/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
    }

    # Login/logout/histórico chamados pelo navegador via fetch().
    location /auth/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_request_headers on;
        # Sem isto o histórico de login registraria 127.0.0.1 para todo
        # mundo, já que quem abre a conexão com o serviço de sessão é o
        # próprio nginx.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        return 404;
    }
}
