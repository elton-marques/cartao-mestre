# Instância de DEMONSTRAÇÃO do Cartão Mestre — eltonmarques.com/cartaomestre-demo
#
# Segunda instância, isolada da produção (deploy/nginx/cartao-mestre.conf):
# porta própria, sem serviço de auth, só dados fictícios. Ver
# deploy/README-demo.md para o raciocínio completo e o passo a passo de
# deploy/atualização.
#
# Por que /cartaomestre-demo/app/ (2 segmentos) e não /cartaomestre-demo/
# direto: app/index.html e app/js/data.js usam paths RELATIVOS
# (../design-system/, ../dados/csv/) que resolvem contra a profundidade da
# URL atual, não contra o nome do path. Com 1 segmento só, "../dados/"
# subiria pra "/dados/" — a location de PRODUÇÃO, que exige cookie de
# sessão (auth_request) que esta instância não tem. Com 2 segmentos,
# "../dados/" resolve pra "/cartaomestre-demo/dados/", location própria
# desta instância. /cartaomestre-demo (sem barra) redireciona pra
# .../app/ automaticamente.
server {
    listen 127.0.0.1:8083;
    server_name eltonmarques.com;
    root /var/www/cartao-mestre-demo;

    # Mesmo motivo do bloco de produção: sem isso o Location dos redirects
    # abaixo sairia como http://...:8083/... em vez de https://... (o
    # nginx local está atrás do túnel, não enxerga o scheme/porta público).
    absolute_redirect off;

    location = /cartaomestre-demo {
        return 301 /cartaomestre-demo/app/;
    }

    location = /cartaomestre-demo/ {
        return 301 /cartaomestre-demo/app/;
    }

    # Sem auth_request de propósito — esta instância não tem login.
    location /cartaomestre-demo/app/ {
        alias /var/www/cartao-mestre-demo/app/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Assets do template — mesmo conteúdo público de produção, servido da
    # cópia própria desta instância (evita qualquer dependência cruzada
    # entre os dois deploys).
    location /cartaomestre-demo/design-system/ {
        alias /var/www/cartao-mestre-demo/design-system/;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # dados/csv/ não existe neste checkout (gitignored, nunca teve dado
    # real aqui) — data.js sonda csv/ primeiro, recebe 404 e cai pro
    # fallback csv-exemplo/ automaticamente. Ver app/js/data.js
    # (DATA_DIRS) e dados/csv-exemplo/README.md.
    location /cartaomestre-demo/dados/ {
        alias /var/www/cartao-mestre-demo/dados/;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        return 404;
    }
}
